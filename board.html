:"arrive",icon:"outlet",name:"Product Outlet",kind:"Product Outlet",slot:"outlet",lock:!0,short:"Atlas\u2019s front door. Checks who, what and whether.",about:"Atlas\u2019s receiving API. Every request passes three gates here: who is calling, whether the data is valid, and whether Red Team allows it.",can:["Check who is calling","Check that the data is valid","Ask Red Team for a decision and enforce it"],cannot:["Be left out. Every operation needs one","Do the work itself"],takes:"A request from a Request runner",gives:"An allowed request, or a clear refusal",placeHint:"after the Request runner, before the Operation"},{id:"server-runner",group:"arrive",icon:"server-runner",name:"Server runner",kind:"Server runner",slot:"server-runner",lock:!0,optional:!0,short:"Optional. Chooses which server binding runs the job.",about:"Chooses among permitted server bindings. Leave it out and one direct binding is used instead.",can:["Pick among permitted server bindings","Be left out entirely"],cannot:["Pick a binding Red Team denies","Change the Operation\u2019s contract"],takes:"An allowed request",gives:"The request, bound to one server",placeHint:"between the Product Outlet and the Operation"},{id:"operation",group:"work",icon:"operation",name:"Operation",kind:"Operation",slot:"operation",lock:!0,short:"The named job, like \u201CContact brief\u201D.",about:"The overall action and its contract. It holds the circuit stages that do the work, in order.",can:["Hold circuit stages in order","Keep one contract for what goes in and what comes out","Run its stages on more than one host"],cannot:["Run without a Product Outlet in front of it","Hold another operation"],takes:"An allowed request",gives:"One result, or a partial result that says what finished",placeHint:"after the Product Outlet (and the Server runner, if you use one)"},{id:"stage",group:"work",icon:"stage",name:"Circuit stage",kind:"Circuit stage",slot:"stage",lock:!0,short:"One piece of required work inside the job.",abo .insp ul.io li span { display: flex; flex-direction: column; }
.insp .rcl { border-radius: 12px; background: rgba(255,255,255,.8); box-shadow: 0 0 0 .5px rgba(0,0,0,.06); padding: 8px 10px; }
.insp .rcl + .rcl { margin-top: 6px; }
.insp .rcn { font-size: 11px; font-weight: 650; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.insp .rci { display: flex; gap: 8px; padding: 5px 0; font-size: 12.5px; line-height: 1.35; }
.insp .rci + .rci { border-top: 1px dashed rgba(0,0,0,.12); }
.insp .rci b { flex: none; min-width: 64px; font: 750 12px/1.35 ui-monospace, "SF Mono", Menlo, monospace; color: #6E6E73; }
.insp .rci.ok b { color: #1F8A3B; } .insp .rci.warn b { color: #B25000; } .insp .rci.bad b { color: #D70015; } .insp .rci.info b { color: #00719F; }
.insp .rci span { display: flex; flex-direction: column; } .insp .rci small { color: var(--ink-3); font-size: 11.5px; }
.insp .rci em { font-style: normal; font-size: 11.5px; color: var(--ink-2); margin-top: 2px; }
.insp ul.io li small { font-size: 11px; color: var(--ink-3); }
.insp .fine { margin: 6px 0 0; font-size: 11.5px; color: var(--ink-3); }
.insp .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin-top: 12px; font-size: 12.5px; }
.insp .kv span { color: var(--ink-3); } .insp .kv b { font-weight: 500; color: var(--ink-2); }
.insp .brk { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; margin-top: 14px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 13.5px; color: #D70015; background: rgba(255,59,48,.1); }
.insp .brk:hover { background: rgba(255,59,48,.16); }
.insp .proto { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: rgba(0,0,0,.05); color: var(--ink-2); margin-top: 10px; }
.insp .proto.perm { color: #D70015; background: rgba(255,59,48,.1); }
.has-insp .legend, .has-insp .outcome { display: none; }
.fallback { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: var(--ink-2); }
.fallback.on { display: grid; }
.fallback b { display: block; font-size: 16px; color: #1D1D1F; margin-bottom: 6px; }
:host([no-title]) .title { visibility: hidden; }
:host([no-bar]) .bar, :host([no-bar]) .menu { display: none !important; }
:host([controls="none"]) .top, :host([controls="none"]) .bar, :host([controls="none"]) .menu, :host([controls="none"]) .insp, :host([controls="none"]) .note, :host([controls="none"]) .outcome, :host([controls="none"]) .opmenu, :host([controls="none"]) .legend { display: none !important; }
@media (max-width: 640px) {
  .legend { display: none; }
  .bar { left: 12px; right: 12px; transform: none; justify-content: space-between; bottom: 12px; }
  .bar .sc { max-width: 150px; } .bar .spd, .bar .sep:nth-of-type(2) { display: none; }
  .insp { left: 12px; right: 12px; top: auto; bottom: 70px; width: auto; max-height: 52%; }
  .note { left: 12px; right: 12px; bottom: 70px; max-width: none; }
  .outcome { left: 12px; right: 12px; top: auto; bottom: 70px; width: auto; max-height: 30%; padding: 10px 12px; }
  .outcome .k { display: none; }
  .opmenu { left: 12px; right: 12px; width: auto; top: calc(60px + var(--ct, 0px)); }
  .toast { top: calc(64px + var(--ct, 0px)); }
  .top { left: 12px; right: 12px; top: calc(12px + var(--ct, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .insp.on { animation: none; } .toast { transition: none; } }
