:host { display: block; position: relative; min-height: 420px; contain: layout paint; font: 500 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Helvetica Neue", system-ui, sans-serif; color: #1D1D1F; -webkit-font-smoothing: antialiased;
  --glass: rgba(255,255,255,.72); --line: rgba(0,0,0,.08); --ink-2: #424245; --ink-3: #86868B; --accent: #2F5BFF; --red: #FF3B30; --ok: #248A3D; --warn: #C93400; }
* { box-sizing: border-box; }
.wrap { position: absolute; inset: 0; overflow: hidden; border-radius: inherit;
  background: radial-gradient(120% 90% at 50% 0%, #FFFFFF 0%, #F4F4F7 46%, #E9E9EE 100%); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
canvas.grab { cursor: grab; } canvas.grabbing { cursor: grabbing; } canvas.point { cursor: pointer; }
.glass { background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
  box-shadow: 0 0 0 .5px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05), 0 10px 30px -10px rgba(0,0,0,.18); }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* hover capsule */
.cap { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 7px; padding: 4px 11px 4px 5px; border-radius: 999px; white-space: nowrap; pointer-events: none;
  background: rgba(255,255,255,.82); -webkit-backdrop-filter: blur(14px) saturate(180%); backdrop-filter: blur(14px) saturate(180%); box-shadow: 0 0 0 .5px rgba(0,0,0,.08), 0 6px 18px -6px rgba(0,0,0,.25);
  opacity: 0; transform: translate(-50%, -100%); transition: opacity .15s ease; will-change: transform; }
.cap.on { opacity: 1; }
.cap svg { width: 24px; height: 24px; flex: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.12)); }
.cap .tx { display: flex; flex-direction: column; line-height: 1.15; }
.cap b { font-weight: 600; font-size: 12.5px; letter-spacing: -.005em; }
.cap small { font-size: 11px; color: var(--ink-3); font-weight: 500; }
.cap i.st { display: none; width: 8px; height: 8px; border-radius: 50%; margin-left: 2px; }
.cap.s-ok i.st { display: block; background: #34C759; } .cap.s-partial i.st { display: block; background: #FF9F0A; }
.cap.s-blocked i.st, .cap.s-denied i.st { display: block; background: var(--red); } .cap.s-skipped i.st { display: block; background: #AEAEB2; }
.cap.s-running i.st { display: block; background: var(--accent); }
/* chrome */
.top { position: absolute; left: 16px; right: 16px; top: calc(14px + var(--ct, 0px)); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; pointer-events: none; }
.top > * { pointer-events: auto; }
.title { display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 8px; border-radius: 999px; }
.title svg { width: 28px; height: 28px; }
.title b { display: block; font: 650 14px/1.15 -apple-system, "SF Pro Display", Inter, system-ui, sans-serif; letter-spacing: -.01em; }

.legend { position: absolute; right: 16px; bottom: 18px; display: grid; grid-template-columns: auto auto; gap: 5px 10px; align-items: center; padding: 10px 14px; border-radius: 16px; font-size: 11.5px; color: var(--ink-2); }

.opmenu button { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 18px 1fr; gap: 1px 8px; padding: 8px 12px 8px 8px; border-radius: 12px; }
.opmenu button:hover, .opmenu button:focus-visible { background: rgba(0,0,0,.05); }
.opmenu button b { grid-column: 2; font-weight: 600; font-size: 13.5px; } .opmenu button small { grid-column: 2; font-size: 12px; color: var(--ink-3); }
.opmenu button .ck { grid-row: 1 / span 2; color: var(--accent); font-weight: 700; align-self: center; }
.toast { position: absolute; left: 50%; top: calc(16px + var(--ct, 0px)); transform: translate(-50%, -8px); display: flex; align-items: center; gap: 8px; max-width: min(560px, calc(100% - 32px)); padding: 9px 16px 9px 12px; border-radius: 999px;
  font-weight: 600; font-size: 13px; opacity: 0; transition: opacity .25s ease, transform .25s ease; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.toast.ok i { background: #34C759; } .toast.warn i { background: #FF9F0A; } .toast.bad i { background: var(--red); }
.toast.bad { color: #B3261E; }
.note { position: absolute; left: 16px; bottom: 84px; max-width: 300px; padding: 10px 12px; border-radius: 14px; font-size: 12.5px; color: var(--ink-2); border-left: 3px solid #FF9F0A; }
.note b { display: block; color: #A15C00; font-size: 12px; margin-bottom: 2px; }
.bar { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; }
.bar button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 999px; font-weight: 600; font-size: 13.5px; color: #1D1D1F; white-space: nowrap; }
.bar button:hover { background: rgba(0,0,0,.05); }
.bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.bar .play { background: var(--accent); color: #fff; padding: 0 16px 0 13px; }
.bar .play:hover { background: var(--accent); filter: brightness(1.08); }
.bar .play[aria-pressed="true"] { background: #1D1D1F; }
.bar .sc { max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
.bar .sc span { overflow: hidden; text-overflow: ellipsis; }
.bar .sep { width: .5px; height: 22px; background: rgba(0,0,0,.14); margin: 0 2px; }
.bar svg { width: 15px; height: 15px; flex: none; }
.bar .ic { width: 36px; padding: 0; justify-content: center; }
.bar .spd { min-width: 44px; justify-content: center; font-variant-numeric: tabular-nums; }
.menu { position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%); width: min(360px, calc(100% - 32px)); padding: 6px; border-radius: 18px; display: none; }
.menu.on { display: block; }
.menu button { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 18px 1fr; gap: 2px 8px; padding: 9px 12px 9px 8px; border-radius: 12px; }
.menu button:hover, .menu button:focus-visible { background: rgba(0,0,0,.05); }
.menu button b { grid-column: 2; font-weight: 600; font-size: 13.5px; }
.menu button small { grid-column: 2; font-size: 12px; color: var(--ink-3); }
.menu button .ck { grid-row: 1 / span 2; color: var(--accent); font-weight: 700; align-self: center; }
.insp { position: absolute; right: 16px; top: calc(76px + var(--ct, 0px)); width: 300px; max-height: calc(100% - 172px - var(--ct, 0px)); overflow-y: auto; padding: 16px; border-radius: 20px; display: none; }
.insp.on { display: block; animation: in .22s cubic-bezier(.2,.9,.25,1); }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }
.insp .x { all: unset; cursor: pointer; position: absolute; right: 12px; top: 12px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.06); color: var(--ink-2); font-size: 14px; }
.insp .hd { display: flex; align-items: center; gap: 12px; padding-right: 28px; }

.insp h3 { margin: 0; font: 650 16px/1.2 -apple-system, "SF Pro Display", Inter, system-ui, sans-serif; letter-spacing: -.012em; }
.insp .ty { font-size: 12px; color: var(--ink-3); }
.insp p { margin: 12px 0 0; font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.insp h4 { margin: 14px 0 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.insp ul { list-style: none; margin: 0; padding: 0; border-radius: 12px; background: rgba(255,255,255,.75); box-shadow: 0 0 0 .5px rgba(0,0,0,.06); }
.insp li { display: flex; gap: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.35; }
.insp li + li { box-shadow: inset 0 .5px 0 rgba(0,0,0,.08); }
.insp li i { flex: none; width: 16px; height: 16px; border-radius: 50%; font: 700 10px/16px system-ui; text-align: center; font-style: normal; color: #fff; background: #34C759; margin-top: 1px; }
.insp li.no i { background: #C7C7CC; }
.insp li.sel { font-weight: 600; } .insp li.sel i { background: var(--accent); }
.insp .phys { margin: 10px 0 0; padding: 8px 10px; border-radius: 10px; background: rgba(47,91,255,.07); color: #1D3FB8; font-size: 12.5px; line-height: 1.4; }
.insp ul.io li { align-items: center; }
.insp ul.io li i { width: auto; min-width: 42px; height: 20px; padding: 0 6px; border-radius: 6px; font: 600 10.5px/20px system-ui; background: #F2D9A6; color: #6B4A10; margin-top: 0; box-sizing: border-box; }
.insp ul.io li.red i { background: rgba(255,59,48,.14); color: #D70015; }
.insp ul.io li span { display: flex; flex-direction: column; }
.insp ul.io li small { font-size: 11px; color: var(--ink-3); }
.insp .fine { margin: 6px 0 0; font-size: 11.5px; color: var(--ink-3); }
.insp .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin-top: 12px; font-size: 12.5px; }
.insp .kv span { color: var(--ink-3); } .insp .kv b { font-weight: 500; color: var(--ink-2); }
.insp .brk { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; margin-top: 14px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 13.5px; color: #D70015; background: rgba(255,59,48,.1); }
.insp .brk:hover { background: rgba(255,59,48,.16); }
.insp .proto { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: rgba(0,0,0,.05); color: var(--ink-2); margin-top: 10px; }
.insp .proto.perm { color: #D70015; background: rgba(255,59,48,.1); }
.has-insp .legend, .has-insp .outcome { display: none; }
.fallback { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: var(--ink-2); }
.fallback.on { display: grid; }
.fallback b { display: block; font-size: 16px; color: #1D1D1F; margin-bottom: 6px; }
:host([no-title]) .title { visibility: hidden; }
:host([no-bar]) .bar, :host([no-bar]) .menu { display: none !important; }

@media (max-width: 640px) {

  .bar { left: 12px; right: 12px; transform: none; justify-content: space-between; bottom: 12px; }
  .bar .sc { max-width: 150px; } .bar .spd, .bar .sep:nth-of-type(2) { display: none; }
  .insp { left: 12px; right: 12px; top: auto; bottom: 70px; width: auto; max-height: 52%; }
  .note { left: 12px; right: 12px; bottom: 70px; max-width: none; }
  .outcome { left: 12px; right: 12px; top: auto; bottom: 70px; width: auto; max-height: 30%; padding: 10px 12px; }
  .outcome .k { display: none; }
  .opmenu { left: 12px; right: 12px; width: auto; top: calc(60px + var(--ct, 0px)); }
  .toast { top: calc(64px + var(--ct, 0px)); }
  .top { left: 12px; right: 12px; top: calc(12px + var(--ct, 0px)); }
