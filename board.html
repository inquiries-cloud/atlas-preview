 Inlet"},{id:"outlet",group:"arrive",icon:"outlet",name:"Product Outlet",kind:"Product Outlet",slot:"outlet",lock:!0,short:"Atlas\u2019s front door. Checks who, what and whether.",about:"Atlas\u2019s receiving API. Every request passes three gates here: who is calling, whether the data is valid, and whether Red Team allows it.",can:["Check who is calling","Check that the data is valid","Ask Red Team for a decision and enforce it"],cannot:["Be left out. Every operation needs one","Do the work itself"],takes:"A request from a Request runner",gives:"An allowed request, or a clear refusal",placeHint:"after the Request runner, before the Operation"},{id:"server-runner",group:"arrive",icon:"server-runner",name:"Server runner",kind:"Server runner",slot:"server-runner",lock:!0,optional:!0,short:"Optional. Chooses which server binding runs the job.",about:"Chooses among permitted server bindings. Leave it out and one direct binding is used instead.",can:["Pick among permitted server bindings","Be left out entirely"],cannot:["Pick a binding Red Team denies","Change the Operation\u2019s contract"],takes:"An allowed request",gives:"The request, bound to one server",placeHint:"between the Product Outlet and the Operation"},{id:"operation",group:"work",icon:"operation",name:"Operation",kind:"Operation",slot:"operation",lock:!0,short:"The named job, like \u201CContact brief\u201D.",about:"The overall action and its contract. It holds the circuit stages that do the work, in order.",can:["Hold circuit stages in order","Keep one contract for what goes in and what comes out","Run its stages on more than one host"],cannot:["Run without a Product Outlet in front of it","Hold another operation"],takes:"An allowed request",gives:"One result, or a partial result that says what finished",placeHint:"after the Product Outlet (and the Server runner, if you use one)"},{id:"stage",group:"work",icon:"stage",name:"Circuit stage",kind:"Circuit stage",slot:"stage",lock:!0,short:"One piece of require
